<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Toy Town Blockout</title>
<style>
  :root { --ink: #f6efe2; --muted: #c9bfae; --card: rgba(20, 18, 24, .74); --line: rgba(246, 239, 226, .18); --accent: #f0a54a;
          --font: system-ui, -apple-system, "Segoe UI", sans-serif; color-scheme: dark; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9fb2c8; font-family: var(--font); color: var(--ink); }
  canvas { display: block; touch-action: none; }
  .card { position: fixed; left: max(16px, env(safe-area-inset-left)); bottom: max(16px, env(safe-area-inset-bottom)); max-width: min(380px, calc(100vw - 32px));
          background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 8px; backdrop-filter: blur(6px); }
  h1 { margin: 0; font: 600 1.05rem/1.2 var(--font); }
  #viewname { font-size: .82rem; color: var(--muted); }
  .row { display: flex; flex-wrap: wrap; gap: 6px; }
  button { font: 500 .78rem/1 var(--font); color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 7px 10px; cursor: pointer; }
  button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #241406; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .note { font-size: .74rem; color: var(--muted); }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
</script>
</head>
<body>
<section class="card" aria-label="Blockout views">
  <h1>Toy Town 3D · Stage A blockout</h1>
  <div id="viewname"></div>
  <div class="row" role="group" aria-label="Camera views">
    <button data-view="overview">Overview</button><button data-view="square">In the square</button>
    <button data-view="toyshop">By the toy shop</button><button data-view="entrance">Station entrance</button>
    <button data-view="rails">Rails</button><button data-view="cutaway">Platforms</button>
  </div>
  <div class="note">Simple shapes for layout only. The blue shop is the finished model, for scale. Drag to look around.</div>
</section>
<script type="module">
  import './blockout.js';
  document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => window.__setView(b.dataset.view));
</script>
</body>
</html>
